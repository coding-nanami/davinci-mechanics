<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Da Vinci's Living Codex</title>
<meta name="description" content="Leonardo da Vinci's ornithopter and self-propelled cart, drawn in ink and rebuilt in timber: a 3D notebook page you can crank, pull apart and read with a mirror.">
<meta name="theme-color" content="#17100a">
<meta property="og:type" content="website">
<meta property="og:title" content="Da Vinci's Living Codex">
<meta property="og:description" content="Leonardo's flying machine, drawn in ink and rebuilt in timber. Crank it, pull it apart, read his mirror writing.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23ecdec1'/%3E%3Cg fill='none' stroke='%233b2614' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M6 37C18 22 26 22 32 34C38 22 46 22 58 37'/%3E%3Cpath d='M32 34v14M14 31l-2 10M22 28v11M42 28v11M50 31l2 10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* One visual world: a leaf from a Renaissance notebook lying on a walnut desk by candle-light.
     Visitors only ever touch things that could sit on that desk: a brass crank, a brass rule, a divider, a hand mirror.
     Maker tools (recording frame, timeline) live in a drawer that stays shut until asked for. */
  :root {
    --desk: #17100a;
    --paper: #ecdec1;
    --ink: #3b2614;
    --ink-soft: rgba(59, 38, 20, 0.62);
    --sanguine: #8c3b22;
    --cream: #e9dcc0;
    --display: "IM Fell English SC", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --body: "IM Fell English", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --toph: 0px; --barh: 0px;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--desk);
    background-image: radial-gradient(ellipse at 40% 38%, #2b1b0f, #120b06 85%);
    background-size: 100% 100%; background-repeat: no-repeat;
    color: var(--cream);
    font-family: var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid #e0a95c; outline-offset: 3px; border-radius: 3px; }
  body[data-mode="wb"] .cine-only, body[data-mode="cine"] .wb-only { display: none !important; }

  /* ---------- The page ---------- */
  #stage {
    position: absolute; overflow: hidden; background: var(--desk);
    touch-action: none; cursor: grab;
    --s: 8px; --sx: 0px; --st: 0px; --sb: 0px;
  }
  body:not(.ui-full) #stage { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.5); }
  #stage.dragging { cursor: grabbing; }
  #stage.pickable { cursor: pointer; }
  #stage.onsplit { cursor: ew-resize; }
  #gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  .title {
    position: absolute;
    left: calc(var(--sx) + var(--s) * 4.4);
    top: calc(var(--st) + var(--s) * 3.4);
    color: var(--ink); pointer-events: none;
    display: grid; gap: calc(var(--s) * 0.5); max-width: 62%;
  }
  .title .mirror { font-style: italic; font-size: calc(var(--s) * 2.4); height: 1.25em; white-space: nowrap; visibility: hidden; justify-self: start; }
  .title h1 { font-family: var(--display); font-weight: 400; font-size: calc(var(--s) * 4.1); line-height: 1.02; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .title p { margin: 0; font-style: italic; font-size: calc(var(--s) * 1.85); color: var(--ink-soft); }
  .caption {
    position: absolute; left: 50%; bottom: calc(var(--sb) + var(--s) * 5); transform: translateX(-50%);
    color: var(--ink); font-style: italic; font-size: calc(var(--s) * 3.0); white-space: nowrap;
    pointer-events: none; opacity: 0; text-align: center;
    text-shadow: 0 0 8px rgba(236, 222, 193, 0.9), 0 0 2px rgba(236, 222, 193, 0.9);
  }
  .caption small { display: block; font-style: normal; font-family: var(--display); font-size: calc(var(--s) * 1.6); letter-spacing: 0.14em; color: var(--sanguine); margin-top: calc(var(--s) * 0.6); }
  body.no-captions .caption { display: none; }
  body.ui-full:not(.clean) .caption { bottom: calc(var(--barh) + var(--s) * 2.5); }

  /* A margin note written beside the inspected part — no card, just ink on the page */
  #note {
    position: absolute; left: 0; top: 0; width: min(292px, 44%);
    color: var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.25s;
    font-size: clamp(14px, calc(var(--s) * 1.95), 17px); line-height: 1.3; font-style: italic;
    text-shadow: 0 0 7px rgba(236, 222, 193, 0.95), 0 0 3px rgba(236, 222, 193, 0.95), 0 0 1px rgba(236, 222, 193, 1);
    z-index: 2;
  }
  #note.on { opacity: 1; }
  #note .in { transform: rotate(-1.4deg); transform-origin: 0 0; }
  #note b { display: block; font-family: var(--display); font-style: normal; font-weight: 400; letter-spacing: 0.1em; font-size: 0.95em; color: var(--sanguine); }
  #note .slot { display: block; height: 1.45em; }
  #note p { margin: 0 0 0.3em; }
  #note .w { opacity: 0; transition: opacity 0.22s; }
  #note.on .w { opacity: 1; }

  #toast {
    position: absolute; left: 50%; top: calc(var(--st) + var(--s) * 9); transform: translate(-50%, 0) rotate(-1deg);
    color: var(--ink); font-size: calc(var(--s) * 2.3); font-style: italic; text-align: center; width: min(40%, 460px);
    text-shadow: 0 0 10px rgba(236, 222, 193, 1), 0 0 4px rgba(236, 222, 193, 1), 0 0 2px rgba(236, 222, 193, 1);
    opacity: 0; transition: opacity 0.35s; pointer-events: none; z-index: 4;
  }
  #toast.on { opacity: 1; }

  /* The leaf that sweeps across when you turn to another machine */
  #turn {
    position: absolute; left: var(--sx); right: var(--sx); top: var(--st); bottom: var(--sb); pointer-events: none; z-index: 5; visibility: hidden;
    background-repeat: no-repeat; transform-origin: 0% 100%;
    box-shadow: 30px 0 46px rgba(0, 0, 0, 0.55), 3px 0 0 rgba(70, 46, 18, 0.55);
  }
  #turn.go { transition: transform 0.85s cubic-bezier(0.5, 0, 0.75, 0.6); transform: translateX(-114%) rotate(-5deg); }

  /* ---------- Brass ---------- */
  .brass {
    background:
      linear-gradient(180deg, rgba(255, 247, 216, 0.6), rgba(255, 247, 216, 0) 36%, rgba(58, 34, 4, 0.38)),
      repeating-linear-gradient(91deg, rgba(255, 255, 255, 0.06) 0 1px, rgba(0, 0, 0, 0.05) 1px 3px),
      linear-gradient(180deg, #dab464, #a67c2c);
    border: 1px solid #553910;
    box-shadow: inset 0 1px 0 rgba(255, 245, 212, 0.65), inset 0 -2px 3px rgba(70, 42, 8, 0.42), 0 7px 14px rgba(30, 18, 4, 0.42), 0 1px 2px rgba(30, 18, 4, 0.6);
    color: #3a2609; text-shadow: 0 1px 0 rgba(255, 240, 200, 0.5);
    font-family: var(--display); letter-spacing: 0.12em;
  }

  /* The divider between ink and timber: a brass grip on the line itself */
  #split {
    position: absolute; left: 0; top: 0; translate: var(--x, 0px) var(--y, 0px); width: 30px; height: 58px; margin: -29px 0 0 -15px; z-index: 3;
    border-radius: 15px; cursor: ew-resize; touch-action: none;
    background:
      linear-gradient(90deg, rgba(60, 36, 6, 0.55), rgba(255, 247, 216, 0.75) 38%, rgba(255, 247, 216, 0.2) 55%, rgba(58, 34, 4, 0.6)),
      linear-gradient(180deg, #dab464, #a67c2c);
    border: 1px solid #553910;
    box-shadow: 0 6px 12px rgba(30, 18, 4, 0.45), 0 1px 2px rgba(30, 18, 4, 0.6), inset 0 0 0 2px rgba(120, 84, 24, 0.35);
  }
  #split::before, #split::after { content: ""; position: absolute; top: 50%; width: 0; height: 0; border: 5px solid transparent; margin-top: -5px; }
  #split::before { left: 3px; border-right-color: #4a3210; border-left-width: 0; }
  #split::after { right: 3px; border-left-color: #4a3210; border-right-width: 0; }
  #split i { position: absolute; left: 50%; top: 9px; bottom: 9px; width: 2px; margin-left: -1px; background: rgba(74, 50, 16, 0.55); border-radius: 1px; }
  #split.live { box-shadow: 0 10px 18px rgba(30, 18, 4, 0.5), 0 1px 2px rgba(30, 18, 4, 0.6), 0 0 0 3px rgba(224, 169, 92, 0.35); }

  /* The hand mirror */
  #lens { position: absolute; left: 0; top: 0; translate: var(--x, 0px) var(--y, 0px); width: 118px; height: 118px; margin: -59px 0 0 -59px; z-index: 3; cursor: grab; touch-action: none; }
  #lens.live { cursor: grabbing; }
  #lens .glass {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.05) 34%, rgba(160, 190, 200, 0.07) 60%, rgba(40, 30, 20, 0.12));
    backdrop-filter: brightness(1.07) contrast(1.04); -webkit-backdrop-filter: brightness(1.07) contrast(1.04);
    box-shadow: inset 0 0 0 7px #b88f3f, inset 0 0 0 8px #553910, inset 0 0 0 10px rgba(255, 244, 205, 0.55), inset 0 0 18px 10px rgba(30, 20, 8, 0.28),
      0 12px 22px rgba(30, 18, 4, 0.45), 0 2px 3px rgba(30, 18, 4, 0.55), 0 0 0 1px #553910;
  }
  #lens .handle {
    position: absolute; left: 80%; top: 80%; width: 62px; height: 15px; border-radius: 4px 8px 8px 4px; transform-origin: 0 50%; transform: rotate(45deg) translateY(-50%);
    background: linear-gradient(180deg, #8a5a2c, #5b3717 55%, #3a220d); border: 1px solid #2a1808; box-shadow: 0 8px 12px rgba(30, 18, 4, 0.4);
  }
  #lens .handle::before { content: ""; position: absolute; left: -3px; top: -2px; bottom: -2px; width: 9px; border-radius: 2px; background: linear-gradient(180deg, #e2c078, #9a7228); border: 1px solid #553910; }
  #lens.flip .glass { box-shadow: inset 0 0 0 7px #e7c983, inset 0 0 0 8px #553910, inset 0 0 0 10px rgba(255, 244, 205, 0.8), inset 0 0 18px 10px rgba(255, 230, 170, 0.25),
      0 12px 22px rgba(30, 18, 4, 0.45), 0 2px 3px rgba(30, 18, 4, 0.55), 0 0 0 1px #553910, 0 0 0 5px rgba(224, 169, 92, 0.28); }
  @keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translate(-7px, 5px) rotate(-7deg); } 60% { transform: translate(3px, -2px) rotate(3deg); } }
  #lens.nudge { animation: nudge 1.1s ease-in-out 2; }

  /* Hand-written prompts that disappear once you have done the thing */
  .hint {
    position: absolute; z-index: 3; pointer-events: none; white-space: nowrap;
    font-style: italic; font-size: 15px; line-height: 1.15; color: var(--sanguine);
    text-shadow: 0 0 6px rgba(236, 222, 193, 0.95), 0 0 2px rgba(236, 222, 193, 0.95);
    opacity: 0; transition: opacity 0.9s;
  }
  .hint svg { position: absolute; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  body.hints .hint { opacity: 0.92; }
  body.did-split #hintSplit, body.did-lens #hintLens, body.did-drive #hintCrank { opacity: 0; }
  #hintSplit { transform: translate(34px, 30px) rotate(-3deg); }
  #hintSplit svg { left: -24px; top: -16px; }
  #hintLens { transform: translate(-100%, 0) translate(-74px, -18px) rotate(-3deg); text-align: right; }
  #hintLens svg { right: -44px; top: 8px; }
  #hintCrank { left: 6px; bottom: calc(100% + 10px); transform: rotate(-3deg); }
  #hintCrank svg { left: 12px; top: 20px; }
  body:not(.ui-full) #hintCrank { color: #d9b98a; text-shadow: none; }

  /* ---------- Things on the desk (outside the page) ---------- */
  .ui { z-index: 6; }
  #tabs { position: fixed; left: 0; top: 0; display: flex; gap: 3px; align-items: flex-end; height: 34px; }
  #tabs button {
    font-family: var(--display); font-size: 14px; letter-spacing: 0.03em; color: #4a3218; white-space: nowrap;
    padding: 6px 13px 7px; border-radius: 7px 7px 0 0; height: 27px; box-sizing: border-box;
    background: linear-gradient(180deg, #c3ab7e, #a98f62);
    box-shadow: inset 0 1px 0 rgba(255, 250, 230, 0.35), inset 0 -5px 6px -4px rgba(40, 24, 8, 0.5), 0 -2px 6px rgba(0, 0, 0, 0.35);
  }
  #tabs button small { opacity: 0.65; margin-right: 6px; }
  #tabs button[aria-pressed="true"] { height: 34px; color: var(--ink); background: linear-gradient(180deg, #f1e6ca, #e7d8b6); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 -3px 8px rgba(0, 0, 0, 0.4); }
  #tabs button.locked { background: linear-gradient(180deg, #9d8a68, #86734f); color: #3e2c16; }
  #tabs button.locked svg { width: 10px; height: 12px; margin-right: 5px; vertical-align: -1px; }
  #tabs button.locked em { font-family: var(--body); font-size: 12px; opacity: 0.8; margin-left: 6px; letter-spacing: 0; }

  #tools { position: fixed; right: 16px; top: 0; height: 36px; display: flex; gap: 18px; align-items: center; font-size: 14px; font-style: italic; color: rgba(233, 220, 192, 0.72); }
  #tools button { padding: 6px 0; border-bottom: 1px dotted rgba(233, 220, 192, 0.35); }
  #tools button:hover, #tools button[aria-pressed="true"] { color: #f6ead0; border-bottom-color: rgba(233, 220, 192, 0.8); }

  #drawer {
    position: fixed; right: 12px; top: 40px; width: min(372px, calc(100% - 24px)); box-sizing: border-box; padding: 12px 14px 10px;
    background: linear-gradient(180deg, rgba(44, 29, 16, 0.97), rgba(26, 17, 9, 0.97));
    border: 1px solid rgba(201, 153, 74, 0.45); border-radius: 4px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 230, 180, 0.08);
    font-size: 14px; display: grid; gap: 9px;
  }
  #drawer[hidden] { display: none; }
  #drawer .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #drawer .row > span { font-family: var(--display); font-size: 11px; letter-spacing: 0.16em; color: rgba(233, 220, 192, 0.5); width: 46px; }
  #drawer button { padding: 3px 9px; border: 1px solid rgba(233, 220, 192, 0.22); border-radius: 3px; color: rgba(233, 220, 192, 0.85); }
  #drawer button:hover { background: rgba(233, 220, 192, 0.08); }
  #drawer button[aria-pressed="true"] { background: #dcc48f; border-color: #dcc48f; color: #21150a; }
  .seg { display: flex; }
  .seg button { border-radius: 0 !important; margin-left: -1px; }
  .seg button:first-child { border-radius: 3px 0 0 3px !important; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0 !important; }

  #bench { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: flex-end; justify-content: center; gap: 14px 26px; flex-wrap: wrap; width: max-content; max-width: calc(100% - 20px); }
  .crankWrap { position: relative; display: flex; align-items: flex-end; gap: 10px; }
  #crank {
    position: relative; width: 86px; height: 86px; border-radius: 50%; flex: none; cursor: grab; touch-action: none;
    background:
      radial-gradient(circle, transparent 0 20%, rgba(70, 44, 10, 0.5) 20.5% 22%, transparent 22.5% 58%, rgba(70, 44, 10, 0.55) 58.5% 60.5%, transparent 61%),
      repeating-conic-gradient(from 0deg, rgba(70, 44, 10, 0.5) 0 1.2deg, transparent 1.2deg 15deg),
      radial-gradient(circle at 34% 28%, #f6dc98, #c89947 46%, #7b5420 100%);
    border: 2px solid #553910;
    box-shadow: inset 0 0 0 4px rgba(255, 240, 200, 0.22), 0 9px 16px rgba(30, 18, 4, 0.5), 0 2px 3px rgba(30, 18, 4, 0.6);
  }
  #crank:active { cursor: grabbing; }
  #crankArm { position: absolute; inset: 0; pointer-events: none; }
  #crankArm::before { content: ""; position: absolute; left: 50%; top: 11px; width: 8px; height: 34px; margin-left: -4px; background: linear-gradient(90deg, #6b4a17, #3d2909); border-radius: 4px; box-shadow: 0 2px 3px rgba(0, 0, 0, 0.5); }
  #crankArm::after { content: ""; position: absolute; left: 50%; top: -2px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9a6a38, #4a2c12 70%, #2a180a); box-shadow: 0 3px 5px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 220, 170, 0.15); }
  #crank > i { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6e5020, #2c1c08); box-shadow: 0 0 0 2px rgba(255, 236, 190, 0.3); }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(224, 169, 92, 0.75); opacity: 1; } 100% { box-shadow: 0 0 0 26px rgba(224, 169, 92, 0); opacity: 0; } }
  #crank::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; pointer-events: none; animation: ring 1.9s ease-out infinite; }
  body.did-drive #crank::after { animation: none; opacity: 0; }
  .plaque { display: grid; gap: 5px; padding: 6px 9px 7px; border-radius: 3px; min-width: 62px; margin-bottom: 6px; }
  .plaque b { font-family: var(--body); font-weight: 400; font-size: 25px; letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 0.9; }
  .plaque b small { font-family: var(--display); font-size: 10px; letter-spacing: 0.16em; opacity: 0.75; margin-left: 4px; }
  #autoBtn { display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.16em; text-shadow: inherit; }
  #autoBtn i { width: 9px; height: 9px; border-radius: 50%; background: #4a3210; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 240, 200, 0.5); }
  #autoBtn[aria-pressed="true"] i { background: radial-gradient(circle at 40% 35%, #fff0b8, #e8922e 60%, #9a4a12); box-shadow: 0 0 7px rgba(255, 170, 60, 0.9), inset 0 0 1px rgba(255, 255, 255, 0.6); }
  .plate { display: flex; align-items: stretch; border-radius: 3px; margin-bottom: 6px; }
  .plate button { padding: 9px 13px 8px; font-size: 13px; letter-spacing: 0.14em; text-shadow: inherit; border-left: 1px solid rgba(74, 50, 16, 0.55); box-shadow: inset 1px 0 0 rgba(255, 244, 205, 0.4); opacity: 0.62; }
  .plate button:first-child { border-left: 0; box-shadow: none; }
  .plate button:hover { opacity: 0.9; }
  .plate button[aria-pressed="true"] { opacity: 1; background: rgba(58, 34, 4, 0.2); box-shadow: inset 0 2px 4px rgba(40, 24, 4, 0.5); }
  .ruler { position: relative; width: min(330px, 78vw); height: 44px; border-radius: 2px; margin-bottom: 6px; }
  .ruler .lbl { position: absolute; left: 50%; transform: translateX(-50%); bottom: 3px; font-size: 9.5px; letter-spacing: 0.2em; opacity: 0.8; pointer-events: none; }
  .ruler .nums { position: absolute; left: 11px; right: 11px; top: 15px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0; pointer-events: none; opacity: 0.85; }
  .ruler .nums span { width: 0; display: flex; justify-content: center; }
  #explode {
    -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0 11px; box-sizing: border-box;
    background:
      repeating-linear-gradient(90deg, rgba(58, 38, 9, 0.95) 0 1.5px, transparent 1.5px 10%) content-box top left / 100% 13px no-repeat,
      repeating-linear-gradient(90deg, rgba(58, 38, 9, 0.7) 0 1px, transparent 1px 2%) content-box top left / 100% 7px no-repeat;
    cursor: ew-resize; outline-offset: 4px;
  }
  #explode::-webkit-slider-runnable-track { height: 100%; background: none; }
  #explode::-moz-range-track { height: 100%; background: none; }
  #explode::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 56px; margin-top: -6px; border-radius: 3px; cursor: ew-resize;
    background: linear-gradient(90deg, #6b4c16, #dcbb6a 38%, #fbeab0 50%, #b48d3c 62%, #5e4212);
    border: 1px solid #3d2808; box-shadow: 0 5px 9px rgba(20, 12, 2, 0.55), inset 0 0 0 1px rgba(255, 244, 205, 0.3);
  }
  #explode::-moz-range-thumb {
    width: 18px; height: 54px; border-radius: 3px; cursor: ew-resize;
    background: linear-gradient(90deg, #6b4c16, #dcbb6a 38%, #fbeab0 50%, #b48d3c 62%, #5e4212);
    border: 1px solid #3d2808; box-shadow: 0 5px 9px rgba(20, 12, 2, 0.55);
  }

  #transport {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); box-sizing: border-box;
    display: flex; align-items: center; gap: 12px; padding: 7px 14px; font-size: 14px;
    background: linear-gradient(180deg, rgba(44, 29, 16, 0.94), rgba(26, 17, 9, 0.94)); border: 1px solid rgba(201, 153, 74, 0.4); border-radius: 4px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
  }
  #play { min-width: 52px; text-align: left; font-family: var(--display); letter-spacing: 0.1em; font-size: 13px; color: #e6cf9c; }

<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const stage = $('stage'), glCanvas = $('gl'), ov = $('ov'), capEl = $('cap'), noteEl = $('note'), toastEl = $('toast');
const octx = ov.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const lerp = THREE.MathUtils.lerp;
const TAU = Math.PI * 2;

/* ---------- GLSL ---------- */
const NOISE_GLSL = /* glsl */`
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x), mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; } return v; }
`;
const QUAD_VS = `void main(){ gl_Position = vec4(position.xy, 0.9999, 1.0); }`;

// The leaf and the desk are painted once per resize into a texture; every other shader just reads it back.
const PAPER_GEN = NOISE_GLSL + /* glsl */`
uniform vec2 uRes; uniform float uDpr, uSeed, uFull; uniform vec4 uSheet; uniform sampler2D uMarks;
float sdBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
vec3 desk(vec2 p){
  float g = fbm(vec2(p.x*0.004, p.y*0.07) + 11.0);
  float w = fbm(vec2(p.x*0.0015, p.y*0.012) + 4.0);
  float rings = 0.5 + 0.5*sin(p.y*0.11 + w*26.0 + g*5.0);
  float pores = vnoise(vec2(p.x*0.05, p.y*1.3));
  vec3 c = mix(vec3(0.080, 0.049, 0.028), vec3(0.185, 0.115, 0.062), 0.55*g + 0.45*rings*g);
  return c * (0.88 + 0.16*pores);
}
void main(){
  vec2 P = gl_FragCoord.xy / uDpr;                    // css px from the bottom-left of the stage
  vec2 s0 = uSheet.xy / uDpr, sz = (uSheet.zw - uSheet.xy) / uDpr;
  vec2 p = P - s0, uv = p / sz;
  float md = min(sz.x, sz.y);
  vec2 pp = p / md + uSeed;                           // resolution-independent paper coordinates

  // deckled, slightly wandering edge of a hand-made sheet
  float wav = (fbm(P*0.010 + 3.7 + uSeed) - 0.5)*9.0 + (fbm(P*0.085 + uSeed) - 0.5)*3.2;
  float d = sdBox(p - 0.5*sz, 0.5*sz, 4.0) + wav*uFull;       // < 0 inside

  float n = fbm(pp*3.0), fine = fbm(pp*55.0);
  float fiber = vnoise(vec2(pp.x*380.0, pp.y*7.0));
  vec3 col = vec3(0.930, 0.872, 0.752) * (0.92 + 0.11*n) - 0.035*fine + 0.014*fiber;
  col += (dFdy(fine) - dFdx(fine)) * uDpr * 0.5;              // tooth, lit from the upper left
  // laid lines and chain lines left by the paper-maker's mould
  col *= 1.0 - 0.012*sin(p.y*2.4 + vnoise(p*0.015)*3.0);
  float ch = abs(fract(p.x/(sz.x/13.0) + 0.02*sin(p.y*0.011)) - 0.5);
  col *= 1.0 - 0.032*(1.0 - smoothstep(0.0, 0.018, ch));
  // age: broad stains with tide lines, foxing
  float st = fbm(pp*1.4 + 7.3);
  col = mix(col, col*vec3(0.86, 0.77, 0.62), smoothstep(0.56, 0.78, st)*0.55);
  col *= 1.0 - 0.06*(1.0 - smoothstep(0.0, 0.010, abs(st - 0.585)))*smoothstep(0.35, 0.6, fbm(pp*4.0 + 1.0));
  float fox = smoothstep(0.80, 0.86, fbm(pp*9.0 + 2.1));
  col = mix(col, col*vec3(0.80, 0.66, 0.50), fox*0.35);
  // an old water mark creeping in from one corner
  vec2 wc = (uv - vec2(0.90, 0.10)) * sz / md;
  float wd = length(wc) + 0.10*(fbm(pp*5.0 + 9.0) - 0.5);
  col *= mix(1.0, 0.962, 1.0 - smoothstep(0.235, 0.245, wd));
  col = mix(col, col*vec3(0.78, 0.68, 0.54), (1.0 - smoothstep(0.0, 0.007, abs(wd - 0.24)))*0.5);
  // spatter from the quill
  vec2 cell = floor(p/64.0), cf = fract(p/64.0);
  if (hash(cell + uSeed*17.0) > 0.945) {
    vec2 o = 0.2 + 0.6*vec2(hash(cell + 1.3), hash(cell + 2.7));
    float r = (0.6 + 1.9*hash(cell + 5.1)) / 64.0;
    col = mix(col, vec3(0.23, 0.15, 0.08), (1.0 - smoothstep(r*0.55, r, length(cf - o)))*0.7);
  }
  // two folds
  float cy = (uv.y - 0.475)*sz.y + 4.0*(vnoise(vec2(p.x*0.012, 1.0)) - 0.5);
  col *= 1.0 + 0.045*exp(-(cy - 1.3)*(cy - 1.3)/2.5) - 0.075*exp(-(cy + 1.0)*(cy + 1.0)/2.5) - 0.025*exp(-cy*cy/500.0);
  float cx = (uv.x - 0.335)*sz.x + 4.0*(vnoise(vec2(p.y*0.012, 5.0)) - 0.5);
  col *= 1.0 + 0.04*exp(-(cx + 1.3)*(cx + 1.3)/2.5) - 0.065*exp(-(cx - 1.0)*(cx - 1.0)/2.5) - 0.02*exp(-cx*cx/500.0);
  // writing showing through from the back of the leaf (red), faint marks on this side (green)
  vec4 mk = texture2D(uMarks, uv);
  col = mix(col, col*vec3(0.76, 0.66, 0.52), mk.r*0.62);
  col = mix(col, vec3(0.25, 0.16, 0.09), mk.g*0.8);
  // handled edges
  float ed = smoothstep(-56.0, 0.0, d);
  col = mix(col, col*vec3(0.72, 0.60, 0.44), ed*ed*0.85*uFull);
  col *= 1.0 - 0.24*smoothstep(-2.5, 0.0, d)*uFull;

  vec3 dk = desk(P);
  float sh = sdBox(p - 0.5*sz - vec2(7.0, -10.0), 0.5*sz, 4.0);
  dk *= 1.0 - 0.66*(1.0 - smoothstep(-8.0, 30.0, sh));
  dk *= 1.0 - 0.4*(1.0 - smoothstep(0.0, 5.0, d));
  gl_FragColor = vec4(mix(dk, col, 1.0 - smoothstep(-0.8, 0.8, d)), 1.0);
}`;

// Shared by every part: read the baked paper, ink↔timber mix across a bleeding split line, dither-dissolve for dimmed parts.
const SPLIT_GLSL = /* glsl */`
float splitCoord(){
  vec2 q = gl_FragCoord.xy / uDpr;
  return gl_FragCoord.x / uRes.x + (fbm(vec2(q.y*0.013, 2.5)) - 0.5)*0.030 + (vnoise(vec2(q.y*0.11, q.x*0.02)) - 0.5)*0.007;
}`;
const PART_GLSL = NOISE_GLSL + /* glsl */`
uniform vec2 uRes; uniform float uDpr; uniform sampler2D uPaper;
uniform float uHatch, uSolid, uSplitX, uDim, uGlow;
vec3 paper(vec2 fc){ return texture2D(uPaper, fc / uRes).rgb; }
` + SPLIT_GLSL + /* glsl */`
float solMaskAt(float xs){
  float grain = vnoise(gl_FragCoord.xy / uDpr * 0.7) - 0.5;      // ink creeps along the paper fibres
  return uSolid * smoothstep(-1.0, 1.0, (xs - uSplitX)/0.0045 + grain*1.7);
}
float wetEdge(float xs){ return uSolid * (1.0 - smoothstep(0.0, 0.009, abs(xs - uSplitX))); }
void dimDiscard(){ if (uDim > 0.004 && hash(floor(gl_FragCoord.xy) * 0.37 + 3.1) < uDim) discard; }
`;
const INK = 'vec3(0.23, 0.15, 0.08)';

const shared = {
  uRes: { value: new THREE.Vector2(1, 1) },
  uDpr: { value: 1 },
  uPaper: { value: null },
  uHatch: { value: 1 },
  uSolid: { value: 1 },
  uSplitX: { value: 0.5 },
};
const NOGLOW = { value: 0 };
const partUniforms = (dimU, glowU = NOGLOW) => ({ uRes: shared.uRes, uDpr: shared.uDpr, uPaper: shared.uPaper, uHatch: shared.uHatch, uSolid: shared.uSolid, uSplitX: shared.uSplitX, uDim: dimU, uGlow: glowU });

// Paper bake
const marksCanvas = document.createElement('canvas');
const marksTex = new THREE.CanvasTexture(marksCanvas);
marksTex.minFilter = marksTex.magFilter = THREE.LinearFilter; marksTex.generateMipmaps = false;
const paperGen = new THREE.ShaderMaterial({
  uniforms: { uRes: shared.uRes, uDpr: shared.uDpr, uSheet: { value: new THREE.Vector4() }, uMarks: { value: marksTex }, uSeed: { value: 0 }, uFull: { value: 1 } },
  vertexShader: QUAD_VS, fragmentShader: PAPER_GEN, depthTest: false, depthWrite: false,
});
const paperScene = new THREE.Scene();
paperScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), paperGen));
paperScene.children[0].frustumCulled = false;
let paperRT = null;

// Background: the baked leaf
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uRes: shared.uRes, uPaper: shared.uPaper },
  vertexShader: QUAD_VS,
  fragmentShader: `uniform vec2 uRes; uniform sampler2D uPaper; void main(){ gl_FragColor = vec4(texture2D(uPaper, gl_FragCoord.xy / uRes).rgb, 1.0); }`,
  depthWrite: false, depthTest: false,
}));
bg.frustumCulled = false; bg.renderOrder = -10;
scene.add(bg);

// Candle-light: one multiply pass over everything, which also draws the split line so it matches the shader edge exactly
const lightU = { uSplitVis: { value: 0 }, uFlick: { value: 0 } };
const light = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uRes: shared.uRes, uDpr: shared.uDpr, uSplitX: shared.uSplitX, ...lightU },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: NOISE_GLSL + `uniform vec2 uRes; uniform float uDpr, uSplitX, uSplitVis, uFlick;` + SPLIT_GLSL + /* glsl */`
    void main(){
      vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x / uRes.y;
      float dn = distance(vec2(uv.x*asp, uv.y), vec2(0.42*asp, 0.60)) / (0.5*length(vec2(asp, 1.0)));
      float fall = smoothstep(0.30, 1.30, dn);
      vec3 c = mix(vec3(1.0), vec3(0.62, 0.52, 0.42), fall) * (1.0 - 0.035*uFlick*(0.4 + fall));
      if (uSplitVis > 0.001 && abs(uv.x - uSplitX) < 0.04) {
        float e = abs(splitCoord() - uSplitX) * uRes.x / uDpr;
        c *= mix(vec3(1.0), vec3(0.50, 0.25, 0.16), (1.0 - smoothstep(0.4, 1.5, e)) * 0.85 * uSplitVis);
        c *= 1.0 - 0.10*uSplitVis*(1.0 - smoothstep(0.0, 10.0, e));
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  transparent: true, depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor,
}));
light.frustumCulled = false; light.renderOrder = 100;
scene.add(light);

const VERT = /* glsl */`
  attribute vec3 aObj;
  varying vec3 vN; varying vec3 vObj; varying vec3 vView; varying vec2 vUv;
  void main(){
    vN = normalize(normalMatrix * normal);
    vObj = aObj; vUv = uv;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vView = mv.xyz;
    gl_Position = projectionMatrix * mv;
  }`;

// Part surface: invisible paper (but occluding) → pen hatching → tinted wood / brass
function makeSurface(hex, metal, dimU, glowU) {
  return new THREE.ShaderMaterial({
    uniforms: { ...partUniforms(dimU, glowU), uColor: { value: new THREE.Color(hex) }, uMetal: { value: metal } },
    vertexShader: VERT,
    fragmentShader: PART_GLSL + /* glsl */`
      uniform float uMetal;
      uniform vec3 uColor;
      varying vec3 vN; varying vec3 vObj; varying vec3 vView;
      void main(){
        dimDiscard();
        float xs = splitCoord(), sol = solMaskAt(xs);
        vec3 N = normalize(vN);
        vec3 V = normalize(-vView);
        vec3 L = normalize(vec3(-0.45, 0.75, 0.55));
        float diff = clamp(dot(N, L), 0.0, 1.0);
        float lam = 0.46 + 0.54*diff;
        vec3 pap = paper(gl_FragCoord.xy);
        vec3 ink = ${INK};

        vec2 fc = gl_FragCoord.xy / uDpr;
        float wob = vnoise(fc*0.04)*2.0;
        float s1 = abs(fract((fc.x + fc.y + wob)/5.5) - 0.5);
        float s2 = abs(fract((fc.x - fc.y + wob)/5.5) - 0.5);
        float l1 = 1.0 - smoothstep(0.10, 0.22, s1);
        float l2 = 1.0 - smoothstep(0.10, 0.22, s2);
        float h = l1*(1.0 - smoothstep(0.50, 0.66, lam)) + l2*(1.0 - smoothstep(0.30, 0.44, lam));
        h = clamp(h*(0.7 + 0.3*vnoise(fc*0.11)), 0.0, 1.0);
        vec3 sketch = mix(pap, ink, h*0.62*uHatch);

        float r = length(vObj.xy);
        float g = fbm(vec2(r*18.0 + vObj.z*0.6, vObj.z*1.4 + r*3.0));
        vec3 base = uColor * mix(0.78 + 0.36*g, 1.0, uMetal);
        vec3 H = normalize(L + V);
        float spec = pow(max(dot(N, H), 0.0), mix(14.0, 34.0, uMetal)) * mix(0.10, 1.0, uMetal);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 2.6);

function setMachine(id, redraw = true, animate = true) {

  Snd.page();
  clearTimeout(turnTimer);
  turnEl.classList.remove('go');
  Object.assign(turnEl.style, { backgroundImage: `url(${snapshotLeaf()})`, backgroundSize: `${page.w}px ${page.h}px`, backgroundPosition: `${-page.sx}px ${-page.st}px`, visibility: 'visible' });

function setMode(m) {

  allParts.forEach((p) => { p.glowU.value = 0; p.lineMat.color.copy(C_INK); });
  capEl.style.opacity = 0;

  else { wb.revealT = 1; wb.camInit = false; }

}
function setPreset(p) {
  preset = p; T = 0;
  press('[data-preset]', (b) => b.dataset.preset === p);
  if (PRESETS[p].machine && mc.id !== PRESETS[p].machine) setMachine(PRESETS[p].machine, false, false);
  setPlaying(true);
}
function setStyle(s) { wb.style = s; wb.splitGoal = STYLE_X[s]; press('[data-style]', (b) => b.dataset.style === s); }
function setPlaying(v) { playing = v; playBtn.textContent = v ? 'PAUSE' : 'PLAY'; }
function setMirror(v) { mirrorOn = v; lensEl.classList.toggle('flip', v); lensEl.setAttribute('aria-pressed', String(v)); }

/* ---------- Interaction ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = stage.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const meshes = [];
  mc.parts.forEach((p) => { if (p.surf.visible) meshes.push(...p.surf.children); });
  const hit = ray.intersectObjects(meshes, false)[0];
  return hit ? hit.object.userData.part : null;
}
function nearSplit(ev) {
  if (mode !== 'wb') return false;
  const r = stage.getBoundingClientRect(), [lo, hi] = splitRange();
  return Math.abs(ev.clientX - r.left - clamp(wb.split, lo, hi) * page.w) < 16 && ev.clientY - r.top > page.st + 6;
}
// Dragging the divider: inside the page it follows the hand; pushed to either edge it lets go into all-ink or all-timber
function dragSplitTo(ev) {
  const r = stage.getBoundingClientRect(), [lo, hi] = splitRange(), u = (ev.clientX - r.left) / page.w;
  if (u > hi - 0.006) wb.splitGoal = 1.06; else if (u < lo + 0.006) wb.splitGoal = -0.06;
  else { wb.splitGoal = u; if (Math.abs(wb.split - u) < 0.25) wb.split = u; }
  wb.style = wb.splitGoal > 1 ? 'ink' : wb.splitGoal < 0 ? 'solid' : 'custom';
  press('[data-style]', (b) => b.dataset.style === wb.style);
  splitEl.setAttribute('aria-valuenow', Math.round(clamp(wb.splitGoal) * 100));
  Snd.slide(); did('split');
}
const zoomBy = (z) => { if (mode === 'wb') wb.zoom = clamp(wb.zoom * z, 0.4, 1.8); else userZoom = clamp(userZoom * z, 0.55, 1.8); };
const pointers = new Map();
let px = 0, py = 0, moved = 0, lastHover = 0, pinchD = 0, moveT = 0;
stage.addEventListener('pointerdown', (ev) => {
  pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
  stage.setPointerCapture(ev.pointerId);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a[0] - b[0], a[1] - b[1]); dragging = false; wb.dragSplit = false; return; }
  moved = 0; px = ev.clientX; py = ev.clientY; moveT = performance.now();
  if (nearSplit(ev)) { wb.dragSplit = true; splitEl.classList.add('live'); dragSplitTo(ev); return; }

});
stage.addEventListener('pointermove', (ev) => {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pointers.size === 2) { // pinch to zoom

  }

      lastHover = performance.now();
      const on = nearSplit(ev), sr = stage.getBoundingClientRect();
      hover.part = on ? null : pick(ev); hover.x = ev.clientX - sr.left; hover.y = ev.clientY - sr.top;
      stage.classList.toggle('onsplit', on); stage.classList.toggle('pickable', !!hover.part);
    }
    return;
  }
  const dx = ev.clientX - px, dy = ev.clientY - py, now = performance.now(), dtm = Math.max(0.008, (now - moveT) / 1000);
  moved += Math.abs(dx) + Math.abs(dy);
  if (mode === 'wb') {
    wb.az += dx * 0.008; wb.el = clamp(wb.el + dy * 0.005, -0.2, 1.3); wb.azTo = null; wb.lastTouch = now;
    wb.azV = lerp(wb.azV, (dx * 0.008) / dtm, 0.4); wb.elV = lerp(wb.elV, (dy * 0.005) / dtm, 0.4);   // carried on after release
  } else {

});
function endPointer(ev, cancelled) {
  pointers.delete(ev.pointerId); pinchD = 0;

  if (wb.dragSplit) { wb.dragSplit = false; splitEl.classList.remove('live'); Snd.brass(0.6); return; }
  if (dragging && !cancelled && moved < 6 && mode === 'wb') { select(pick(ev)); wb.lastTouch = performance.now(); }
  if (performance.now() - moveT > 90 || moved < 6) wb.azV = wb.elV = 0;

stage.addEventListener('pointerup', (ev) => endPointer(ev, false));
stage.addEventListener('pointercancel', (ev) => endPointer(ev, true));
stage.addEventListener('pointerleave', () => { hover.part = null; });
stage.addEventListener('dblclick', (ev) => { if (ev.target === lensEl || lensEl.contains(ev.target)) return; userAz = 0; userEl = 0; userZoom = 1; wb.zoom = 1; wb.el = 0.34; });
function pump(deltaY) { wb.omega = clamp(wb.omega + clamp(Math.abs(deltaY), 0, 120) * 0.012 * (deltaY > 0 ? 1 : -1), -OMEGA_MAX, OMEGA_MAX); did('drive'); }
// Scrolling anywhere on the page feeds the flywheel; pinch (or ctrl-scroll) zooms
stage.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (mode === 'wb' && !ev.ctrlKey) { pump(Math.abs(ev.deltaY || ev.deltaX)); return; }
  zoomBy(Math.exp(ev.deltaY * (ev.ctrlKey ? 0.01 : 0.001)));
}, { passive: false });
splitEl.addEventListener('keydown', (ev) => {
  const step = ev.key === 'ArrowRight' ? 0.05 : ev.key === 'ArrowLeft' ? -0.05 : 0;
  if (!step) return;
  const [lo, hi] = splitRange(), u = clamp(wb.splitGoal, lo, hi) + step;
  wb.splitGoal = u > hi ? 1.06 : u < lo ? -0.06 : u; wb.style = 'custom'; press('[data-style]', () => false); did('split');

// The hand mirror: carry it over the page and the writing under the glass turns round; a tap turns the whole page
let lensMoved = 0, lox = 0, loy = 0;
lensEl.addEventListener('pointerdown', (ev) => {
  ev.stopPropagation(); ev.preventDefault();
  lens.drag = true; lensMoved = 0; lox = ev.clientX - lens.x; loy = ev.clientY - lens.y;
  lensEl.setPointerCapture(ev.pointerId); lensEl.classList.add('live'); lensEl.classList.remove('nudge');

});
lensEl.addEventListener('pointermove', (ev) => {
  if (!lens.drag) return;
  const nx = clamp(ev.clientX - lox, 20, page.w - 20), ny = clamp(ev.clientY - loy, 20, page.h - 20);
  lensMoved += Math.abs(nx - lens.x) + Math.abs(ny - lens.y);
  lens.x = nx; lens.y = ny; lens.home = false;

lensEl.addEventListener('pointerup', endLens);
lensEl.addEventListener('pointercancel', () => { lens.drag = false; lensEl.classList.remove('live'); });

});

// Brass crank: drag round it to turn the machine by hand, scroll over it to kick the flywheel
const crank = $('crank');
let crankAng = 0, crankT = 0;
const angAt = (ev) => { const r = crank.getBoundingClientRect(); return Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2))); };

const endCrank = () => { if (wb.dragCrank && performance.now() - crankT > 120) wb.omega = 0; wb.dragCrank = false; };
crank.addEventListener('pointerup', endCrank);
crank.addEventListener('pointercancel', endCrank);
crank.addEventListener('wheel', (ev) => { ev.preventDefault(); pump(ev.deltaY); }, { passive: false });
crank.addEventListener('keydown', (ev) => { if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') pump(60); if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') pump(-60); });

playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; T = (scrub.value / 1000) * PRESETS[preset].dur * 0.9999; setPlaying(false); });
scrub.addEventListener('change', () => { scrubbing = false; });
let lastStep = 0;
$('explode').addEventListener('input', (ev) => { const v = +ev.target.value; setExplode(v); if (Math.round(v / 5) !== lastStep) { lastStep = Math.round(v / 5); Snd.brass(0.35); } });
document.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => setMachine(b.dataset.m)));
document.querySelectorAll('button[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-style]').forEach((b) => b.addEventListener('click', () => { setStyle(b.dataset.style); Snd.brass(); did('split'); }));
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => setPreset(b.dataset.preset)));
document.querySelectorAll('[data-ar]').forEach((b) => b.addEventListener('click', () => { aspectMode = b.dataset.ar; press('[data-ar]', (x) => x === b); resize(); }));
$('autoBtn').addEventListener('click', () => { wb.auto = !wb.auto; $('autoBtn').setAttribute('aria-pressed', String(wb.auto)); Snd.brass(); did('drive'); });
const capBtn = $('capBtn');
capBtn.addEventListener('click', () => { const off = document.body.classList.toggle('no-captions'); capBtn.setAttribute('aria-pressed', String(!off)); });
$('cleanBtn').addEventListener('click', toggleClean);
$('exitClean').addEventListener('click', toggleClean);
let exitTimer = 0;
window.addEventListener('pointermove', () => {
  if (!document.body.classList.contains('clean')) return;
  $('exitClean').classList.add('show'); clearTimeout(exitTimer); exitTimer = setTimeout(() => $('exitClean').classList.remove('show'), 1800);
});
const recBtn = $('recBtn'), drawer = $('drawer');
function setDrawer(open) { drawer.hidden = !open; recBtn.setAttribute('aria-pressed', String(open)); }
recBtn.addEventListener('click', () => setDrawer(drawer.hidden));
const sndBtn = $('sndBtn');
sndBtn.addEventListener('click', () => { const on = Snd.toggle(); sndBtn.textContent = on ? 'Sound: on' : 'Sound: off'; sndBtn.setAttribute('aria-pressed', String(on)); if (on) Snd.brass(); });
// The third leaf is not drawn yet. Nothing is counted here, so the page does not pretend to take a vote.
$('vote').addEventListener('click', () => {
  Snd.page();
  toast('This leaf is still blank. If you want the Aerial Screw (Ms. B, f. 83v) drawn next, say so wherever you found this page.');
});

window.addEventListener('keydown', (ev) => {
  const inRange = ev.target instanceof HTMLInputElement;
  if (ev.key === ' ') {
    ev.preventDefault();
    if (mode === 'wb') { wb.space = true; did('drive'); } else if (!ev.repeat) setPlaying(!playing);

  }

  else if (k === 'escape') { if (document.body.classList.contains('clean')) toggleClean(); else if (!drawer.hidden && !wb.sel) setDrawer(false); else select(null); }
  else if (k === 'm') { setMirror(!mirrorOn); did('lens'); }
  else if (k === 's') sndBtn.click();
  else if (k === 'c') capBtn.click();
  else if (k === 'r') setDrawer(drawer.hidden);
  else if (k === '1') setStyle('ink'); else if (k === '2') setStyle('half'); else if (k === '3') setStyle('solid');

  else if (mode === 'cine' && ev.key === 'ArrowRight') T = (T + 0.5) % PRESETS[preset].dur;
  else if (mode === 'cine' && ev.key === 'ArrowLeft') T = (T - 0.5 + PRESETS[preset].dur) % PRESETS[preset].dur;
});
window.addEventListener('keyup', (ev) => { if (ev.key === ' ') wb.space = false; });
window.addEventListener('blur', () => { wb.space = false; });

/* ---------- Boot. URL hash sets a starting state, e.g. #mode=cine&preset=viral&ar=9:16&clean=1 ---------- */
const q = new URLSearchParams(location.hash.slice(1));
setMachine(q.get('m') === 'cart' ? 'cart' : 'orni', true, false);

if (q.get('style') in STYLE_X) { setStyle(q.get('style')); wb.split = wb.splitGoal; }

// hand-written prompts appear once the drawing is finished, and bow out on their own
setTimeout(() => { document.body.classList.add('hints'); if (!reduceMotion) lensEl.classList.add('nudge'); }, reduceMotion ? 300 : 2700);
setTimeout(() => document.body.classList.remove('hints'), 24000);
// test / recording hooks
window.__seek = (t) => { T = t; setPlaying(false); if (mode === 'cine') renderCine(true); };
window.__codex = { wb, lens, page, setMode, setPreset, setMachine, setStyle, setExplode, setMirror, setDrawer, select: (id) => select(mc.byId[id]), machines: MACHINES, renderer };
document.fonts && document.fonts.ready.then(resize);
$('loading').remove();
